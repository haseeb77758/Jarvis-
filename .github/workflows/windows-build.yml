name: Windows test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run integration and validation tests
        run: python -m unittest discover -s tests -v
      - name: Windows UI and screen smoke test
        run: python tools/windows_smoke.py
      - name: Build the Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Jarvis app.py
      - name: Verify the built app starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath '.\dist\Jarvis\Jarvis.exe' -ArgumentList '--self-test' -PassThru
          if (-not $app.WaitForExit(45000)) {
            $app.Kill()
            throw 'Built app smoke test timed out.'
          }
          if ($app.ExitCode -ne 0) { throw "Built app failed: $($app.ExitCode)" }
      - name: Add the quick-start guide
        shell: pwsh
        run: |
          Copy-Item README.md,README-ROMAN-URDU.md,SETUP-LOCAL-AI.bat -Destination dist/Jarvis/
      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Windows-x64
          path: dist/Jarvis/
          if-no-files-found: error
          retention-days: 14
