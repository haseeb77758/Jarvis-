name: Windows test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-livekit-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run integration and validation tests
        run: python -m unittest discover -s tests -v
      - name: Test actual Windows venv COM shortcut creation in temp dirs
        run: python tools/smoke_windows_shortcuts.py
      - name: Test isolated personal Python install with Store files absent
        run: python tools/smoke_local_installer.py
      - name: Windows UI and screen smoke test
        run: python tools/windows_smoke.py
      - name: Test live free neural Urdu and English speech (optional network)
        id: free-voice-live
        continue-on-error: true
        run: python tools/smoke_free_voice.py
      - name: Upload live free voice samples when available
        if: steps.free-voice-live.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Free-Voice-Samples
          path: dist/free-voice-samples/*.wav
          if-no-files-found: error
          retention-days: 14
      - name: Prepare bundled voice model
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python tools/prepare_voice_model.py
      - name: Test synthetic voice output and local recognition
        run: python tools/voice_smoke.py
      - name: Build the Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name Jarvis --collect-all urdunlp --copy-metadata urdunlp --collect-all edge_tts --copy-metadata edge-tts --collect-all certifi --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all onnxruntime --collect-all av --collect-all _sounddevice_data --collect-submodules pywinauto --collect-submodules comtypes --hidden-import win32com.client --add-data "web/connect.html;web" --add-data "web/connect.js;web" --add-data "web/connect.css;web" --add-data "build-assets/voice-model;voice-model" --add-data "livekit_agent.py;." --add-data "livekit_requirements.txt;." --add-data "EDGE-TTS-LICENSE.txt;." --add-data "GPL-3.0.txt;." --add-data "THIRD-PARTY-NOTICES.txt;." app.py
      - name: Verify the built app starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath '.\dist\Jarvis.exe' -ArgumentList '--self-test' -PassThru
          if (-not $app.WaitForExit(180000)) {
            $app.Kill()
            throw 'Built app smoke test timed out.'
          }
          if ($app.ExitCode -ne 0) { throw "Built app failed: $($app.ExitCode)" }
      - name: Package reviewable Windows source
        run: python tools/package_source.py
      - name: Verify source archive and manifest
        run: python tools/verify_source_zip.py dist/Jarvis-Source-Windows.zip
      - name: Upload reviewable Windows source
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Source-Windows
          path: dist/Jarvis-Source-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-UNSIGNED-Development-Windows-x64
          path: dist/Jarvis.exe
          if-no-files-found: error
          retention-days: 14

