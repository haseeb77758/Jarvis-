name: Windows test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run integration and validation tests
        run: python -m unittest discover -s tests -v
      - name: Windows UI and screen smoke test
        run: python tools/windows_smoke.py
      - name: Prepare bundled voice model
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python tools/prepare_voice_model.py
      - name: Test synthetic voice output and local recognition
        run: python tools/voice_smoke.py
      - name: Build the Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name Jarvis --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all onnxruntime --collect-all av --collect-all _sounddevice_data --collect-submodules pywinauto --collect-submodules comtypes --hidden-import win32com.client --add-data "build-assets/voice-model;voice-model" app.py
      - name: Verify the built app starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath '.\dist\Jarvis.exe' -ArgumentList '--self-test' -PassThru
          if (-not $app.WaitForExit(180000)) {
            $app.Kill()
            throw 'Built app smoke test timed out.'
          }
          if ($app.ExitCode -ne 0) { throw "Built app failed: $($app.ExitCode)" }
      - name: Package reviewable Windows source
        run: python tools/package_source.py
      - name: Verify source archive and manifest
        run: python tools/verify_source_zip.py dist/Jarvis-Source-Windows.zip
      - name: Upload reviewable Windows source
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Source-Windows
          path: dist/Jarvis-Source-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-UNSIGNED-Development-Windows-x64
          path: dist/Jarvis.exe
          if-no-files-found: error
          retention-days: 14
