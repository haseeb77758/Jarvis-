name: Browser preview checks
on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/test_browser.py', '.github/workflows/browser-check.yml', '.devcontainer/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test browser workflows using a mocked provider
        run: python tools/test_browser.py
