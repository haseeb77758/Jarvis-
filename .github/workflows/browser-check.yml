name: Browser preview checks
on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/test_browser.py', 'tools/test_account_browser.py', 'account_chat.py', '.github/workflows/browser-check.yml', '.devcontainer/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python -m pip install playwright
      - name: Test browser workflows using a mocked provider
        env:
          JARVIS_BROWSER_CHANNEL: chrome
        run: python tools/test_browser.py
      - name: Test native account relay in browser using mocked sign-in and AI
        env:
          JARVIS_BROWSER_CHANNEL: chrome
        run: python tools/test_account_browser.py
      - name: Verify direct Jarvis LiveKit WebRTC UI and native RPC boundary (mocked)
        env:
          JARVIS_BROWSER_CHANNEL: chrome
        run: python tools/test_direct_browser.py

